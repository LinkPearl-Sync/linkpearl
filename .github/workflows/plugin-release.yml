name: Publier le plugin

# Une version se publie en poussant un tag :
#
#   git tag v0.2.0 && git push origin v0.2.0          version stable
#   git tag v0.2.0-test && git push origin v0.2.0-test   canal de test
#
# Le canal de test sert aux versions qu'on donne à quelques personnes sans
# les imposer à tout le monde : Dalamud ne les propose qu'à ceux qui ont
# coché « Get plugin testing builds ».

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    # Les actions sont épinglées sur une empreinte de commit et non sur une
    # étiquette. Une étiquette se redéplace : celui qui la contrôle exécuterait
    # son code dans ce workflow, qui écrit sur le dépôt et publie les versions
    # que les joueurs installent.
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Lire le tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          IS_TEST=false
          [[ "$VERSION" == *-test ]] && IS_TEST=true
          VERSION="${VERSION%-test}"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_TEST=$IS_TEST" >> $GITHUB_OUTPUT

      - name: Installer .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '10.0.x'

      - name: Récupérer Dalamud
        shell: pwsh
        run: |
          # Le SDK Dalamud compile contre les assemblies du jeu, qu'il cherche
          # dans le dossier de XIVLauncher. Un runner n'en a pas.
          $info = Invoke-RestMethod -Uri "https://aonyx.ffxiv.wang/Dalamud/Release/VersionInfo?track=staging"
          Invoke-WebRequest -Uri $info.downloadUrl -OutFile dalamud.7z
          New-Item -ItemType Directory -Force -Path "$env:AppData\XIVLauncher\addon\Hooks\dev" | Out-Null
          7z x dalamud.7z -o"$env:AppData\XIVLauncher\addon\Hooks\dev" -y

      - name: Vérifier le noyau
        # Le noyau se teste sans le jeu : un échec ici doit empêcher la
        # publication, pas être découvert par les joueurs.
        run: dotnet test Linkpearl.Core.Tests/Linkpearl.Core.Tests.csproj --nologo

      - name: Compiler
        shell: bash
        # La version vient du nom du tag, que quelqu'un choisit. Passée par
        # l'environnement plutôt qu'interpolée dans le script, elle ne peut pas
        # être lue comme du shell : un tag « v1.0$(commande) » s'exécuterait
        # sinon avec les droits du workflow, qui écrit sur le dépôt.
        env:
          VERSION: ${{ steps.tag.outputs.VERSION }}
        # « -p: » et non « /p: » : sous Windows, Git Bash prend un argument qui
        # commence par une barre oblique pour un chemin et le convertit, ce qui
        # livrait à MSBuild un « p:Version=... » qu'il lisait comme un second
        # projet à compiler.
        run: >
          dotnet build Linkpearl/Linkpearl.csproj
          -c Release
          -warnaserror
          "-p:Version=$VERSION"

      - name: Empaqueter
        shell: bash
        run: |
          # Le SDK Dalamud produit déjà l'archive au bon format.
          cp Linkpearl/bin/Release/LinkpearlSync/latest.zip LinkpearlSync.zip
          unzip -l LinkpearlSync.zip

      - name: Publier la version
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.tag.outputs.VERSION }}${{ steps.tag.outputs.IS_TEST == 'true' && ' (test)' || '' }}
          prerelease: ${{ steps.tag.outputs.IS_TEST == 'true' }}
          files: LinkpearlSync.zip
          generate_release_notes: true

      - name: Mettre à jour le manifeste du dépôt
        shell: pwsh
        # Même raison qu'à la compilation : rien de ce qui vient du tag n'est
        # interpolé dans le script.
        env:
          VERSION: ${{ steps.tag.outputs.VERSION }}
          IS_TEST: ${{ steps.tag.outputs.IS_TEST }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $v      = $env:VERSION
          $isTest = $env:IS_TEST -eq "true"
          $base   = "https://github.com/$env:REPOSITORY/releases/download/$env:TAG"

          $entry = (Get-Content repo.json -Raw | ConvertFrom-Json)[0]

          # Le niveau d'API vient du manifeste que le SDK vient de générer :
          # le coder en dur ici le ferait mentir au prochain changement.
          $manifest = Get-Content Linkpearl/bin/Release/LinkpearlSync/LinkpearlSync.json -Raw | ConvertFrom-Json
          $entry.DalamudApiLevel = $manifest.DalamudApiLevel
          $entry | Add-Member -MemberType NoteProperty -Name TestingDalamudApiLevel `
                              -Value $manifest.DalamudApiLevel -Force

          # Sans LastUpdate, Dalamud date l'entrée de 1970 et la relègue en bas
          # de son onglet des nouveautés.
          $entry.LastUpdate = [int][DateTimeOffset]::UtcNow.ToUnixTimeSeconds()

          if ($isTest) {
            # Le canal stable n'est pas touché : une version de test ne doit
            # atteindre que ceux qui les ont demandées.
            $entry.TestingAssemblyVersion = "$v.0"
            $entry.DownloadLinkTesting    = "$base/LinkpearlSync.zip"
          } else {
            $entry.AssemblyVersion        = "$v.0"
            $entry.TestingAssemblyVersion = "$v.0"
            $entry.DownloadLinkInstall    = "$base/LinkpearlSync.zip"
            $entry.DownloadLinkUpdate     = "$base/LinkpearlSync.zip"
            $entry.DownloadLinkTesting    = "$base/LinkpearlSync.zip"
          }

          ConvertTo-Json @($entry) -Depth 10 | Set-Content repo.json

      - name: Enregistrer le manifeste sur main
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Le tag est détaché : on reporte le manifeste sur main, sinon la
          # prochaine publication repartirait de l'ancien.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git stash push repo.json
          git checkout main
          git stash pop

          git add repo.json
          git diff --staged --quiet || git commit -m "chore: manifeste du dépôt pour $TAG"
          git push origin main
